name: 构建桌面客户端

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 允许创建 Release 与上传产物
permissions:
  contents: write

jobs:
  build:
    name: 构建 ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows 10 / 11 客户端（x64）
          - os: windows-latest
            label: Windows x64
            target: win
            args: --win
          # macOS 10.15+ Intel 客户端（x64）
          # GitHub 的 Intel runner（macos-13）已下线，排队不到机器；
          # 改用 Apple Silicon runner（macos-latest）交叉编译 x64 包
          - os: macos-latest
            label: macOS Intel x64
            target: mac
            args: --mac --x64

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        working-directory: client
        run: npm install

      - name: 生成图标
        working-directory: client
        run: node scripts/gen-icons.js

      - name: 构建 ${{ matrix.label }}
        working-directory: client
        env:
          # 未配置苹果签名证书时跳过签名（产物未签名，首次打开需右键 → 打开）
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: 上传安装包到工作流产物
        uses: actions/upload-artifact@v4
        with:
          name: gongshi-client-${{ matrix.target }}
          path: |
            client/dist/*.exe
            client/dist/*.dmg
            client/dist/*.zip
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 汇总各平台安装包
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: gongshi-client-*
          merge-multiple: true

      - name: 列出待发布文件
        run: ls -lh dist

      - name: 创建 Release 并上传安装包
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: 公式手册 ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          body: |
            ## 桌面客户端 ${{ github.ref_name }}

            | 平台 | 文件 | 说明 |
            | --- | --- | --- |
            | Windows 10 / 11（x64） | `公式手册 Setup *.exe` | 安装包（NSIS） |
            | Windows 10 / 11（x64） | `公式手册 *.exe` | 便携版，无需安装 |
            | macOS 10.15+（Intel x64） | `公式手册-*.dmg` | 拖拽安装 |
            | macOS 10.15+（Intel x64） | `公式手册-*.zip` | 压缩包 |

            **使用方式**
            1. NAS 上运行服务：`docker compose up -d`（默认端口 3333）
            2. 启动客户端，首次输入 NAS 地址（如 `http://192.168.1.10:3333`），测试连接后保存
            3. 之后每次启动自动连接；NAS 地址变更可在菜单「文件 → 修改 NAS 地址」（`Ctrl+,` / `Cmd+,`）中修改

            **注意**：macOS 安装包未签名，首次打开需右键 → 「打开」。
          files: dist/*
